apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-credential-broker
  namespace: internal-credential-broker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: internal-credential-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: internal-credential-broker
    spec:
      serviceAccountName: internal-credential-broker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: broker
        image: ghcr.io/labring/sealos-internal-credential-broker:latest
        imagePullPolicy: IfNotPresent
        command: [/broker]
        ports:
        - name: https
          containerPort: 8443
        env:
        - name: BROKER_OIDC_ISSUER
          valueFrom:
            configMapKeyRef:
              name: internal-credential-broker-config
              key: oidc-issuer
        - name: BROKER_OIDC_AUDIENCE
          valueFrom:
            configMapKeyRef:
              name: internal-credential-broker-config
              key: oidc-audience
        - name: BROKER_OIDC_JWKS_URL
          valueFrom:
            configMapKeyRef:
              name: internal-credential-broker-config
              key: oidc-jwks-url
        - name: BROKER_KUBERNETES_AUDIENCE
          valueFrom:
            configMapKeyRef:
              name: internal-credential-broker-config
              key: kubernetes-audience
        - name: BROKER_CLUSTER_SERVER
          valueFrom:
            configMapKeyRef:
              name: internal-credential-broker-config
              key: cluster-server
        - name: BROKER_INTERNAL_CLIENT_CA_FILE
          valueFrom:
            configMapKeyRef:
              name: internal-credential-broker-config
              key: internal-client-ca-file
        - name: BROKER_REQUEST_RATE_LIMIT
          valueFrom:
            configMapKeyRef:
              name: internal-credential-broker-config
              key: request-rate-limit
        - name: BROKER_REQUEST_RATE_BURST
          valueFrom:
            configMapKeyRef:
              name: internal-credential-broker-config
              key: request-rate-burst
        - name: BROKER_TRUSTED_PROXY_CIDRS
          valueFrom:
            configMapKeyRef:
              name: internal-credential-broker-config
              key: trusted-proxy-cidrs
        - name: BROKER_ALLOWED_CLIENT_CIDRS
          valueFrom:
            configMapKeyRef:
              name: internal-credential-broker-config
              key: allowed-client-cidrs
        - name: BROKER_TRUSTED_CLIENT_IP_HEADER
          valueFrom:
            configMapKeyRef:
              name: internal-credential-broker-config
              key: trusted-client-ip-header
        - name: BROKER_TLS_CERT_FILE
          valueFrom:
            configMapKeyRef:
              name: internal-credential-broker-config
              key: tls-cert-file
        - name: BROKER_TLS_KEY_FILE
          valueFrom:
            configMapKeyRef:
              name: internal-credential-broker-config
              key: tls-key-file
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        readinessProbe:
          httpGet:
            scheme: HTTPS
            path: /healthz
            port: https
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            scheme: HTTPS
            path: /healthz
            port: https
          initialDelaySeconds: 15
          periodSeconds: 20
        volumeMounts:
        - name: broker-tls
          mountPath: /etc/broker/tls
          readOnly: true
        - name: internal-client-ca
          mountPath: /etc/broker/internal-client-ca
          readOnly: true
        - name: kube-api-token
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
      volumes:
      - name: broker-tls
        secret:
          secretName: internal-credential-broker-tls
      - name: internal-client-ca
        secret:
          secretName: internal-credential-broker-client-ca
          optional: true
      - name: kube-api-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              audience: https://kubernetes.default.svc.cluster.local
              expirationSeconds: 600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
